<div class="sidebar-card">
  <h5>Eng ko‘p o‘qilgan</h5>
  {% for new in most_viewed %}
    <div class="sidebar-item">
      <span class="time">{{ new.created_at|date:"d.m" }} | 👁 {{ new.count_views }}</span>
      <a href="{% url 'read_more' new.slug %}">{{ new.title|truncatechars:60 }}</a>
    </div>
  {% endfor %}
</div>
